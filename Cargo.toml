[workspace]
resolver = "2"
members = [
    "crates/brand",
    "crates/chart",
    "crates/metafile",
    "crates/ooxml",
    "crates/ss-model",
    "crates/ss-formula",
    "crates/ss-xlsx",
    "crates/ss-csv",
    "crates/ss-xls",
    "crates/wp-model",
    "crates/wp-layout",
    "crates/wp-doc",
    "crates/wp-docx",
    "crates/wp-odf",
    "crates/wp-text",
    "crates/wp-print",
    "crates/cfb",
    "crates/dpi-guard",
    "crates/ui-kit",
    "crates/app-calx",
    "crates/app-scriva",
    "crates/wp-compare",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adnan-huggingface/officina"

[workspace.dependencies]
brand = { path = "crates/brand" }
chart = { path = "crates/chart" }
metafile = { path = "crates/metafile" }
ooxml = { path = "crates/ooxml" }
ss-model = { path = "crates/ss-model" }
ss-formula = { path = "crates/ss-formula" }
ss-xlsx = { path = "crates/ss-xlsx" }
ss-csv = { path = "crates/ss-csv" }
ss-xls = { path = "crates/ss-xls" }
wp-model = { path = "crates/wp-model" }
wp-layout = { path = "crates/wp-layout" }
wp-doc = { path = "crates/wp-doc" }
wp-docx = { path = "crates/wp-docx" }
wp-odf = { path = "crates/wp-odf" }
wp-text = { path = "crates/wp-text" }
wp-print = { path = "crates/wp-print" }
cfb-reader = { path = "crates/cfb" }
dpi-guard = { path = "crates/dpi-guard" }
ui-kit = { path = "crates/ui-kit" }
# The applications themselves, so that the fidelity comparator can measure a
# page with the very shaper the screen paints with rather than a stand-in.
scriva = { path = "crates/app-scriva" }

# Release profile: optimize for a small, fast, self-contained binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Dev builds of dependencies are optimized so that opening a large xlsx while
# debugging our own code does not take a minute.
[profile.dev.package."*"]
opt-level = 2
