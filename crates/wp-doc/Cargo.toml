[package]
name = "wp-doc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "wp_doc"
path = "src/lib.rs"

[dependencies]
cfb-reader.workspace = true
# A metafile picture arrives deflated inside the drawing layer, so a `.doc`
# cannot hand one on without inflating it first.
flate2 = "1"
wp-model.workspace = true

[dev-dependencies]
# The escape hatch a `.doc` is read for: proving it can be written out again as
# a modern document is part of proving the reader is worth anything.
wp-docx.workspace = true
