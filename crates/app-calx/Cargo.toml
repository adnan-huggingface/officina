[package]
name = "calx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "calx"
path = "src/lib.rs"

[[bin]]
name = "calx"
path = "src/main.rs"

[dependencies]
ui-kit.workspace = true
ss-model.workspace = true
ss-formula.workspace = true
ss-xlsx.workspace = true
ss-csv.workspace = true
ss-xls.workspace = true
# Default features: the XDG portal on Linux, so a build needs no GTK headers.
rfd = "0.15"
# Only the formats Excel actually embeds. The default feature set pulls in a
# dozen decoders for formats no xlsx has ever contained.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
# Ctrl+; types today's date, which is a *local* date; std only knows UTC.
time = { version = "0.3", features = ["local-offset"] }
# Menu-driven paste has no key event to ride, so the OS clipboard has to be
# *read*; egui only ever hears about it through Ctrl+V.
arboard = { version = "3", default-features = false }
