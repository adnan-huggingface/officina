[package]
name = "scriva"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "scriva"
path = "src/lib.rs"

[[bin]]
name = "scriva"
path = "src/main.rs"

# The executable's icon is drawn by the build script; see build.rs.
[build-dependencies]
brand.workspace = true

[dependencies]
chart.workspace = true
metafile.workspace = true
ui-kit.workspace = true
wp-model.workspace = true
wp-layout.workspace = true
wp-doc.workspace = true
wp-docx.workspace = true
wp-odf.workspace = true
wp-text.workspace = true
wp-print.workspace = true
ooxml.workspace = true
# Default features: the XDG portal on Linux, so a build needs no GTK headers.
rfd = "0.15"
# Menu-driven paste has no key event to ride, so the OS clipboard has to be
# read directly. Same choice as Calx, for the same reason. `image-data` is what
# reads a screen snippet off the board: it is a bitmap in one of two formats and
# neither of them is text.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Only the formats a .docx actually embeds. The default feature set pulls in a
# dozen decoders for formats no document has ever contained.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }

# A copy has to put three formats on the board at once — text, CF_HTML and RTF
# — inside one open, or the last one written is the only one there. arboard
# offers two of the three and no way to add a third, so the Windows copy path
# goes through the crate arboard itself uses. Not a new dependency: it is
# already in the tree underneath arboard.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
