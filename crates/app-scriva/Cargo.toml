[package]
name = "scriva"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "scriva"
path = "src/lib.rs"

[[bin]]
name = "scriva"
path = "src/main.rs"

[dependencies]
ui-kit.workspace = true
wp-model.workspace = true
wp-layout.workspace = true
wp-doc.workspace = true
wp-docx.workspace = true
wp-text.workspace = true
wp-print.workspace = true
ooxml.workspace = true
# Default features: the XDG portal on Linux, so a build needs no GTK headers.
rfd = "0.15"
# Menu-driven paste has no key event to ride, so the OS clipboard has to be
# read directly. Same choice as Calx, for the same reason.
arboard = { version = "3", default-features = false }
# Only the formats a .docx actually embeds. The default feature set pulls in a
# dozen decoders for formats no document has ever contained.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
