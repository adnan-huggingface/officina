[package]
name = "wp-print"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wp-model.workspace = true
wp-layout.workspace = true
# The same deflate ooxml already links for zip parts. A PDF whose streams are
# not compressed is three times the file for no reason.
flate2 = "1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Memory",
    "Win32_UI_Controls_Dialogs",
]
